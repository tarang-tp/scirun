[project]
name = "scirun"
version = "0.0.1"
description = "A CLI for running and managing scientific workloads on Kubernetes (pre-alpha)."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "typer>=0.12",
    "kubernetes>=29.0",
    "pyyaml>=6.0",
]

[dependency-groups]
dev = ["pytest>=8.0", "ruff>=0.5"]

[project.scripts]
scirun = "scirun.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/scirun"]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["typer.Argument", "typer.Option"]
